<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asena Security — Under Construction</title>
  <meta name="description" content="Asena Security — site under construction.">
  <link rel="icon" href="/assets/logo.png">
  <style>
    :root { --bg:#0f1316; --fg:#e6e9eb; --muted:#8a949b; --accent:#4fd9d6; }
    * { box-sizing:border-box; }
    html,body { height:100%; margin:0; }
    body {
      background:var(--bg); color:var(--fg);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      display:flex; align-items:center; justify-content:center; text-align:center; padding:24px 16px;
    }
    main { max-width:560px; }
    img { width:120px; height:auto; margin-bottom:24px; }
    h1 { font-size:2rem; margin:0 0 12px; }
    .tag { display:inline-block; color:var(--accent); text-transform:uppercase; letter-spacing:.1em; font-size:.75rem; font-weight:700; margin-bottom:16px; }
    p { color:var(--muted); line-height:1.6; margin:0 0 24px; }
    a { color:var(--accent); text-decoration:none; }
    a:hover { text-decoration:underline; }
  </style>
</head>
<body>
  <main>
    <img src="/assets/logo.png" alt="Asena Security logo">
    <div class="tag">Under Construction</div>
    <h1>Asena Security</h1>
    <p>Our new site is on the way. Check back soon.</p>
    <p>In the meantime, read the blog at <a href="https://blog.asenasecurity.com">blog.asenasecurity.com</a>.</p>
  </main>
</body>
</html>
