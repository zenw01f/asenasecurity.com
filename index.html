<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asena Security — Under Construction</title>
  <meta name="description" content="Asena Security — site under construction.">
  <link rel="icon" href="/assets/asena-shield.png">
  <style>
    :root { --bg:#0f1316; --fg:#e6e9eb; --muted:#8a949b; --accent:#4772c4; --line:rgba(255,255,255,.1); }
    * { box-sizing:border-box; }
    html,body { margin:0; }
    body {
      background:var(--bg); color:var(--fg);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
      text-align:center; padding:48px 16px;
    }
    main { width:100%; max-width:720px; }
    .lockup { width:100%; max-width:466px; height:auto; margin-bottom:32px; }
    .tag { display:inline-block; color:var(--accent); text-transform:uppercase; letter-spacing:.12em; font-size:.75rem; font-weight:700; margin-bottom:14px; }
    p { color:var(--muted); line-height:1.6; margin:0 0 16px; }
    a { color:#6f95db; text-decoration:none; }
    a:hover { text-decoration:underline; }

    .build { margin-top:56px; padding-top:28px; border-top:1px solid var(--line); }
    .build h2 { font-size:.75rem; text-transform:uppercase; letter-spacing:.12em; color:var(--muted); margin:0 0 20px; font-weight:600; }
    .steps { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
    figure { margin:0; background:rgba(255,255,255,.03); border:1px solid var(--line); border-radius:8px; padding:16px; display:flex; flex-direction:column; align-items:center; justify-content:space-between; }
    figure img { max-width:100%; height:110px; object-fit:contain; }
    figcaption { font-size:.8rem; color:var(--muted); margin-top:12px; line-height:1.4; }
    @media (max-width:600px) { .steps { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <main>
    <img class="lockup" src="/assets/asena-logo-horizontal.png" alt="Asena Security">
    <div class="tag">Under Construction</div>
    <p>Our new site is on the way. Check back soon.</p>
    <p>In the meantime, read the blog at <a href="https://blog.asenasecurity.com">blog.asenasecurity.com</a>.</p>

    <section class="build">
      <h2>Logo rebuild</h2>
      <div class="steps">
        <figure><img src="/assets/logo.png" alt="Original square logo"><figcaption>Original — wordmark overlays the shield</figcaption></figure>
        <figure><img src="/assets/asena-wordmark.png" alt="Extracted wordmark"><figcaption>Wordmark separated from the shield</figcaption></figure>
        <figure><img src="/assets/asena-shield.png" alt="Clean shield"><figcaption>Clean shield from assets</figcaption></figure>
      </div>
    </section>
  </main>
</body>
</html>
